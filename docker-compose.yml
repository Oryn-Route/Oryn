version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: orynroute-postgres
    environment:
      POSTGRES_USER: orynroute
      POSTGRES_PASSWORD: orynroute_dev
      POSTGRES_DB: orynroute
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orynroute"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - orynroute-network

  redis:
    image: redis:7-alpine
    container_name: orynroute-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - orynroute-network

volumes:
  postgres_data:
  redis_data:

networks:
  orynroute-network:
    driver: bridge
